<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Other Self — Karakter Taslakları</title>
<style>
  body { margin:0; background:#0B0B0B; color:#E8E4D8; font-family:"Comic Sans MS","Comic Relief",cursive; }
  header { padding:24px 32px 4px; }
  h1 { margin:0; font-size:34px; }
  p.sub { color:#8A8A8A; margin:6px 0 0; font-size:14px; }
  section { margin:16px 32px; background:#121212; border:1px solid #2A2A2A; border-radius:14px; padding:12px 16px 8px; }
  h2 { margin:0 0 4px; font-size:22px; }
  .note { color:#9a9a9a; font-size:13px; margin:0 0 6px; }
  svg { width:100%; height:auto; display:block; }
  .lbl { fill:#8A8A8A; font-size:15px; font-family:"Comic Sans MS","Comic Relief",cursive; }
  .sw { display:inline-flex; align-items:center; gap:6px; margin:6px 14px 4px 0; font-size:12px; color:#9a9a9a; }
  .sw i { width:20px; height:20px; border-radius:6px; border:1px solid #333; display:inline-block; }
</style>
</head>
<body>
<header>
  <h1>3 karakter taslağı + gölge ikizleri</h1>
  <p class="sub">Aynı rig ve animasyon sistemi; siluet, renk ve gölge rengi farklı. En altta thumbnail boyutunda siluet testi.</p>
</header>

<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="glowWide" x="-60%" y="-40%" width="220%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="glowRim" x="-40%" y="-30%" width="180%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="eyeGlow" x="-100%" y="-200%" width="300%" height="500%"><feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="vig" cx="50%" cy="48%" r="70%"><stop offset="0" stop-color="#141414"/><stop offset=".6" stop-color="#0D0D0D"/><stop offset="1" stop-color="#060606"/></radialGradient>
</defs></svg>

<div id="root"></div>

<section>
  <h2>Thumbnail boyutunda siluet testi</h2>
  <p class="note">Telefonda küçük görünce hangisi rakipten ayırt ediliyor? (soldan: v1 fasulye — rakibe en yakın, A, B, C)</p>
  <svg id="thumb" viewBox="0 0 1200 230"></svg>
</section>

<script src="hero-rig.js"></script>
<script>
  const { hero, POSES, STYLES } = TOS;
  const bg = (w, h) => `<rect width="${w}" height="${h}" fill="url(#vig)"/>`;
  const floor = (y, w) => `<path d="M 0 ${y} L ${w} ${y}" stroke="#8E8E8E" stroke-width="2.5" stroke-linecap="round"/>`;
  const label = (x, y, t) => `<text class="lbl" x="${x}" y="${y}" text-anchor="middle">${t}</text>`;

  const DESC = {
    lantern: 'Ayrı yuvarlak kafa + ince boyun + küçük armut gövde, ince uzuvlar. Kâğıt beyazı. Gölge ikizi mor parıltılı. Daha "insan", daha kırılgan, duygusal konulara çok uygun.',
    drop: 'Tek parça damla gövde; sivri tepe = imza (saç kıvrımına gerek yok). Kısa tombul uzuvlar. Gri-mavi. Gölge ikizi camgöbeği parıltılı. En sade ve en farklı siluet; thumbnail\'da anında tanınır.',
    moon: 'Büyük ay-kafa + küçük gövde + çöp uzuvlar, tepede filiz. Kum rengi. Gölge ikizi elektrik mavisi. En sevimli ve en "maskot" olanı; filiz büyüme/dönüşüm metaforu taşır.',
  };

  let html = '';
  ['lantern', 'drop', 'moon'].forEach((key) => {
    const S = STYLES[key];
    let svg = bg(1200, 540) + floor(470, 1200);
    svg += hero({ style: key, pose: POSES.standing, expression: 'neutral', x: 170, y: 470, scale: 1.12 });
    svg += hero({ style: key, pose: POSES.standing, x: 400, y: 470, scale: 1.12, facing: -1, shadow: { mood: 'smug' } });
    // expressions (top row)
    [['neutral', 580], ['sad', 700], ['determined', 820], ['happy', 940]].forEach(([e, x]) => {
      svg += hero({ style: key, mode: 'headOnly', expression: e, x, y: 85, scale: 0.78 }) + label(x, 150, e);
    });
    // poses (bottom row)
    svg += hero({ style: key, pose: POSES.sad, expression: 'sad', x: 600, y: 470, scale: 0.62 });
    svg += hero({ style: key, pose: POSES.run, expression: 'determined', x: 760, y: 470, scale: 0.62, token: 'headband' });
    svg += hero({ style: key, pose: POSES.sitEdge, expression: 'confident', x: 910, y: 470, scale: 0.62 });
    svg += hero({ style: key, pose: POSES.standing, x: 1090, y: 470, scale: 0.62 * 1.7, facing: -1, shadow: { mood: 'slit' } });
    svg += label(170, 515, 'kahraman') + label(400, 515, 'öteki benlik') + label(600, 515, 'üzgün') + label(760, 515, 'koşu') + label(910, 515, 'oturma') + label(1090, 515, 'gölge (boss)');
    const sw = [['gövde', S.body], ['mürekkep', S.ink], ['gölge parıltı', S.shadow.glow], ['gölge göz', S.shadow.eye]]
      .map(([n, c]) => `<span class="sw"><i style="background:${c}"></i>${n} ${c}</span>`).join('');
    html += `<section><h2>${S.name}</h2><p class="note">${DESC[key]}</p><svg viewBox="0 0 1200 540">${svg}</svg>${sw}</section>`;
  });
  document.getElementById('root').innerHTML = html;

  // thumbnail-size silhouette test (hero + twin per style, small)
  let t = bg(1200, 230) + floor(200, 1200);
  ['bean', 'lantern', 'drop', 'moon'].forEach((key, i) => {
    const x = 150 + i * 300;
    t += hero({ style: key, pose: POSES.standing, expression: 'determined', x: x - 45, y: 200, scale: 0.42 });
    t += hero({ style: key, pose: POSES.standing, x: x + 50, y: 200, scale: 0.42 * 1.3, facing: -1, shadow: { mood: 'slit' } });
    t += label(x, 225, STYLES[key].name);
  });
  document.getElementById('thumb').innerHTML = t;
</script>
</body>
</html>
